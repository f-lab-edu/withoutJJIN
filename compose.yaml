services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ftfm
      MYSQL_USER: ftfm
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  gotenberg:
    # DOCX 변환에 사용할 LibreOffice 전용 이미지. 실행 환경마다 같은 버전을 사용한다.
    image: gotenberg/gotenberg:9.1.0-libreoffice
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Gotenberg가 변환 요청 하나를 처리하는 시간 제한.
      API_TIMEOUT: 60s
      # 최대 20MiB DOCX와 multipart 요청의 부가 데이터를 수용한다.
      API_BODY_LIMIT: 25MB
      # Spring이 파일을 직접 전송하므로 URL 다운로드·웹훅은 사용하지 않는다.
      API_DISABLE_DOWNLOAD_FROM: "true"
      WEBHOOK_DISABLE: "true"

volumes:
  mysql-data: