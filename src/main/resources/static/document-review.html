<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>PDF 피드백 · FTFM</title>
    <style>
        :root { color-scheme: light; --ink: #18352c; --muted: #718079; --green: #16785a; --line: #dce7de; --paper: #fff; }
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        body { margin: 0; color: var(--ink); background: #eef6ee; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
        button, a { font: inherit; }
        button:focus-visible, a:focus-visible { outline: 3px solid #79b99e; outline-offset: 3px; }
        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 32px; border-bottom: 1px solid var(--line); background: var(--paper); }
        .brand { font-size: 21px; font-weight: 800; letter-spacing: -.04em; }
        .back { color: var(--green); text-decoration: none; font-weight: 650; }
        main { max-width: 1540px; margin: auto; padding: 32px; }
        .heading { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
        .eyebrow { margin: 0 0 10px; color: var(--green); font-size: 13px; font-weight: 750; letter-spacing: .08em; }
        h1 { margin: 0; font-size: clamp(24px, 3vw, 36px); overflow-wrap: anywhere; }
        .version { display: inline-block; margin-top: 12px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 20px; background: white; font-size: 14px; }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; }
        .button { display: inline-flex; align-items: center; justify-content: center; padding: 10px 16px; border: 1px solid var(--line); border-radius: 10px; background: white; color: var(--ink); text-decoration: none; cursor: pointer; }
        .selection-color { display: inline-flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: white; }
        .selection-color select { max-width: 100%; font: inherit; color: var(--ink); background: transparent; border: 0; }
        .button.primary { background: var(--green); border-color: var(--green); color: white; }
        .button:disabled { opacity: .5; cursor: wait; }
        .status { margin: 0 0 20px; color: var(--muted); line-height: 1.6; }
        .status[data-error="true"] { color: #974534; }
        .review-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
        .panel { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: white; }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 24px; border-bottom: 1px solid var(--line); }
        h2 { margin: 0; font-size: 18px; }
        .page-count { color: var(--muted); font-size: 13px; white-space: nowrap; }
        .pdf-pages { display: grid; justify-items: center; gap: 20px; max-height: 75vh; overflow: auto; padding: 20px; background: #e7ede8; }
        .pdf-pages canvas { display: block; max-width: 100%; height: auto; background: white; box-shadow: 0 2px 12px #18352c1a; }
        .pdf-page { position: relative; max-width: 100%; line-height: 0; }
        .pdf-pages[data-selection-enabled="true"] .pdf-page[data-ready="true"] { cursor: crosshair; touch-action: none; user-select: none; }
        .pdf-selection { position: absolute; border: 2px solid #16785a; background: #39a87926; pointer-events: none; }
        .button[aria-pressed="true"] { border-color: var(--green); background: #edf7ef; color: var(--green); }
        .selection-summary { padding: 24px; }
        .selection-summary h3 { margin: 0 0 12px; font-size: 17px; }
        .selection-summary p { line-height: 1.8; }
        .selection-summary .hint { color: var(--muted); font-size: 14px; }
        .pdf-placeholder { display: grid; min-height: 65vh; place-items: center; padding: 24px; color: var(--muted); background: #f4f7f4; }
        .feedback-panel { position: sticky; top: 24px; min-height: 55vh; }
        .feedback-placeholder { padding: 52px 28px; color: var(--muted); text-align: center; line-height: 1.8; }
        .feedback-symbol { display: grid; place-items: center; width: 52px; height: 52px; margin: 0 auto 20px; border-radius: 50%; background: #edf5ef; color: var(--green); font-size: 24px; }
        .feedback-placeholder strong { color: var(--ink); }
        @media (max-width: 900px) { main { padding: 24px 16px; } .topbar { padding: 18px 16px; } .review-grid { grid-template-columns: minmax(0, 1fr); } .feedback-panel { position: static; min-height: 240px; } .pdf-pages { padding: 10px; } }
    </style>
</head>
<body>
<header class="topbar">
    <span class="brand">FTFM</span>
    <a id="workspace-back" class="back" href="/">← 워크스페이스로 돌아가기</a>
</header>
<main>
    <div class="heading">
        <div>
            <p class="eyebrow">DOCUMENT REVIEW</p>
            <h1 id="document-title">PDF 피드백</h1>
            <span id="document-version" class="version" hidden></span>
        </div>
        <div class="actions">
            <label class="selection-color" for="selection-color">영역 색상
                <select id="selection-color" name="selectionColor">
                    <option value="green">초록</option>
                    <option value="yellow">노랑</option>
                    <option value="blue">파랑</option>
                    <option value="pink">분홍</option>
                </select>
            </label>
            <button id="selection-mode" class="button" type="button" aria-pressed="false" disabled>영역 선택</button>
            <button id="selection-clear" class="button" type="button" disabled>선택 취소</button>
            <button id="pdf-renew" class="button" type="button" disabled>PDF 다시 열기</button>
            <a id="pdf-new-tab" class="button" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer" hidden>새 창에서 보기 ↗</a>
            <a id="review-login" class="button primary" href="/oauth2/authorization/google" hidden>Google로 다시 로그인</a>
        </div>
    </div>
    <p id="pdf-status" class="status" role="status" aria-live="polite">PDF를 불러오고 있어요.</p>
    <div id="review-content" class="review-grid" aria-busy="true">
        <section class="panel" aria-labelledby="pdf-heading">
            <div class="panel-head"><h2 id="pdf-heading">PDF 문서</h2><span id="page-count" class="page-count"></span></div>
            <div id="pdf-placeholder" class="pdf-placeholder">문서를 준비하고 있어요.</div>
            <div id="pdf-pages" class="pdf-pages" role="region" aria-label="변환된 PDF 페이지" tabindex="0" hidden></div>
        </section>
        <aside class="panel feedback-panel" aria-labelledby="feedback-heading">
            <div class="panel-head"><h2 id="feedback-heading">문서 피드백</h2></div>
            <section id="selection-summary" class="selection-summary" aria-labelledby="selection-heading" hidden>
                <h3 id="selection-heading">선택한 영역</h3>
                <p id="selection-page" role="status" aria-live="polite"></p>
                <p class="hint">다른 영역을 드래그하면 선택이 바뀝니다. 선택을 취소하려면 ‘선택 취소’ 또는 Esc를 눌러 주세요.</p>
            </section>
            <div id="feedback-placeholder" class="feedback-placeholder">
                <span class="feedback-symbol" aria-hidden="true">▢</span>
                <strong>문서의 특정 부분에 대한 의견</strong>
                <p>‘영역 선택’을 켜고 PDF에서 원하는 부분을 드래그해 주세요. 터치로 스크롤하려면 ‘영역 선택’을 꺼 주세요.</p>
            </div>
        </aside>
    </div>
</main>
<script type="module">
    import {initializeDocumentReview} from "/js/document-review.mjs?v=selection-color-1";
    initializeDocumentReview();
</script>
</body>
</html>
