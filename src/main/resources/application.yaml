spring:
  config:
    import: "optional:file:./.env[.properties][encoding=utf-8]"

  application:
    name: withoutJJIN
  datasource:
    url: jdbc:mysql://localhost:3307/ftfm
    username : ftfm
    password: ${DB_PASSWORD}


  jpa:
    hibernate:
      ddl-auto: update
    # 직접 콘솔 출력 대신 Logback으로 SQL을 출력하여 스케줄러 SQL만 필터링한다.
    show-sql: false
    properties:
      hibernate:
        format_sql: true


  session:
    timeout: 30m
    jdbc:
      initialize-schema: always  # 세션 테이블 준비


  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile

invitation:
  token:
    encryption-key: ${INVITATION_TOKEN_ENCRYPTION_KEY}

aws:
  credentials:
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  s3:
    # 파일을 저장할 S3 버킷 이름
    bucket: ${S3_BUCKET:}
    # 버킷이 위치한 AWS 리전
    region: ${AWS_REGION:ap-northeast-2}
    # 업로드 URL 유효기간. 여기서는 5분
    upload-url-expiration: 5m
    # PDF 조회 URL 유효기간. 발급할 때마다 소속과 최신 변환 상태를 확인한다.
    download-url-expiration: 5m
    # 업로드 완료 확인용 HeadObject의 전체·단일 시도 시간 제한이다.
    head-api-call-timeout: ${S3_HEAD_API_CALL_TIMEOUT:10s}
    head-api-call-attempt-timeout: ${S3_HEAD_API_CALL_ATTEMPT_TIMEOUT:3s}
    async-head:
      max-concurrency: ${S3_ASYNC_HEAD_MAX_CONCURRENCY:12}
      max-pending-connection-acquires: ${S3_ASYNC_HEAD_MAX_PENDING_CONNECTION_ACQUIRES:12}
      event-loop-threads: ${S3_ASYNC_HEAD_EVENT_LOOP_THREADS:2}
      connection-timeout: ${S3_ASYNC_HEAD_CONNECTION_TIMEOUT:2s}
      connection-acquisition-timeout: ${S3_ASYNC_HEAD_CONNECTION_ACQUISITION_TIMEOUT:1s}

document:
  upload-completion:
    async:
      threads: ${UPLOAD_COMPLETION_ASYNC_THREADS:4}
      queue-capacity: ${UPLOAD_COMPLETION_ASYNC_QUEUE_CAPACITY:8}
      response-timeout: ${UPLOAD_COMPLETION_ASYNC_RESPONSE_TIMEOUT:30s}
      max-in-flight: ${UPLOAD_COMPLETION_ASYNC_MAX_IN_FLIGHT:12}
  conversion:
    # IntelliJ에서 실행하는 Spring의 접속 주소. 같은 Compose 내부에서는 http://gotenberg:3000을 사용한다.
    base-url: ${DOCUMENT_CONVERSION_BASE_URL:http://localhost:3000}
    # 변환 서버와 연결을 맺기까지 기다리는 시간.
    connect-timeout: 3s
    # Gotenberg의 60초 제한 후 실패 응답을 받을 수 있도록 조금 더 기다린다.
    read-timeout: 65s
    worker:
      # 일반 실행에서는 자동 변환을 활성화한다. 테스트 프로필에서는 비활성화한다.
      enabled: ${DOCUMENT_CONVERSION_WORKER_ENABLED:true}
      # 최초 실행 전, 그리고 한 회차가 끝난 뒤 다음 실행까지 기다리는 시간.
      poll-delay: ${DOCUMENT_CONVERSION_POLL_DELAY:10s}
      # 한 회차에 조회할 최대 건수. 변환은 한 건씩 순차 실행한다.
      batch-size: ${DOCUMENT_CONVERSION_BATCH_SIZE:5}
  storage:
    deletion:
      # 실제 S3 삭제 스케줄러는 명시적으로 활성화한다.
      worker:
        enabled: ${S3_OBJECT_DELETION_WORKER_ENABLED:false}
        poll-delay: ${S3_OBJECT_DELETION_POLL_DELAY:10s}
        batch-size: ${S3_OBJECT_DELETION_BATCH_SIZE:5}
      # 작업 중 서버가 종료되면 이 시간이 지난 후 다시 처리한다.
      claim-lease: ${S3_OBJECT_DELETION_CLAIM_LEASE:2m}
      retry-delay: ${S3_OBJECT_DELETION_RETRY_DELAY:1m}


logging:
  level:
    org.hibernate.SQL: DEBUG
