spring:
  config:
    import: "optional:file:./.env[.properties][encoding=utf-8]"

  application:
    name: withoutJJIN
  datasource:
    url: jdbc:mysql://localhost:3307/ftfm
    username : ftfm
    password: ${DB_PASSWORD}


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


  session:
    timeout: 30m
    jdbc:
      initialize-schema: always  # 세션 테이블 준비


  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile

invitation:
  token:
    encryption-key: ${INVITATION_TOKEN_ENCRYPTION_KEY}
  mail:
    # 명시적으로 켠 환경에서만 대기 중인 초대 메일을 자동 발송한다.
    enabled: ${INVITATION_MAIL_ENABLED:false}
    # 개발 발송을 특정 수신 주소로 제한한다. 비어 있으면 수신 주소를 제한하지 않는다.
    allowed-recipient: ${INVITATION_MAIL_ALLOWED_RECIPIENT:}
    # 한 번의 처리가 끝난 뒤 다음 실행까지 기다리는 시간이다.
    poll-delay: ${INVITATION_MAIL_POLL_DELAY:10s}
    # 초대 확인 화면 주소. 실제 배포 시 프론트엔드 주소로 설정한다.
    page-url: ${INVITATION_PAGE_URL:http://localhost:8080/invite}

aws:
  credentials:
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  ses:
    region: ${AWS_REGION}
    from-email: ${SES_FROM_EMAIL}

